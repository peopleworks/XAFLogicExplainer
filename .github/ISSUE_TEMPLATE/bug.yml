name: Bug report
description: Something crashed, hung, or behaved incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the tool *ran fine* but failed to understand an XAF pattern, please use the
        **Extraction gap** template instead — that one turns straight into a test case.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact command you ran.
      placeholder: |
        1. xaflogic extract --project "..."
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Console output or stack trace
      description: >
        Paste the error. **Check it for tokens first** — `--enrich` and `sync` failures can include
        credentials in the message.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `xaflogic --version`, or the commit you built from.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
