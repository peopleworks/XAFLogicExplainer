<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="fig-pipe-t fig-pipe-d">
  <style>
    svg {
      --fig-bg: #0a0d12;
      --fig-panel: #10151d;
      --fig-line: #232b36;
      --fig-graphite: #46505e;
      --fig-graphite-ink: #737f8f;
      --fig-ink: #e8edf3;
      --fig-mute: #8794a4;
      --fig-yours: #ff8a3d;
      --fig-yours-soft: rgba(255,138,61,.14);
      --fig-ok: #4ade80;
    }

    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t-mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
    .t-cap { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
             font-size: 11px; letter-spacing: .12em; text-transform: uppercase; fill: var(--fig-mute); }
    .t-title { font-size: 15px; font-weight: 640; fill: var(--fig-ink); }
    .t-body { font-size: 12.5px; fill: var(--fig-mute); }
    .t-yours { fill: var(--fig-yours); font-weight: 640; }
    .t-grey { fill: var(--fig-graphite-ink); }
  </style>
  
          <title id="fig-pipe-t">How extraction works</title>
          <desc id="fig-pipe-d">Source files are parsed as syntax by Roslyn, never compiled,
            producing a model that is rendered to agent files, an MCP server, or Markdown.</desc>

          <rect width="900" height="210" fill="var(--fig-bg)"/>
          <defs>
            <marker id="fig-arrow2" viewBox="0 0 10 10" refX="8" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--fig-graphite)"/>
            </marker>
          </defs>

          <text class="t-cap" x="20" y="26">Your source is read, never built</text>

          <!-- inputs: yours, so in colour -->
          <g class="pop">
            <rect x="20" y="58" width="112" height="34" rx="8" fill="var(--fig-yours-soft)" stroke="var(--fig-yours)"/>
            <text class="t-mono t-body" x="76" y="80" text-anchor="middle" style="fill:var(--fig-yours)">*.cs</text>
            <rect x="20" y="108" width="112" height="34" rx="8" fill="var(--fig-yours-soft)" stroke="var(--fig-yours)"/>
            <text class="t-mono t-body" x="76" y="130" text-anchor="middle" style="fill:var(--fig-yours)">*.xafml</text>
          </g>

          <path  d="M140,100 H184" fill="none" stroke="var(--fig-graphite)"
                stroke-width="1.5" marker-end="url(#fig-arrow2)"/>

          <!-- the mechanism: machinery, so in graphite -->
          <g class="pop pop--2">
            <rect x="190" y="56" width="196" height="88" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)"/>
            <text class="t-title t-grey" x="288" y="90" text-anchor="middle">Roslyn</text>
            <text class="t-body" x="288" y="112" text-anchor="middle">syntax trees only</text>
            <rect x="222" y="122" width="132" height="18" rx="9" fill="none" stroke="var(--fig-ok)" stroke-width="1"/>
            <text class="t-cap" x="288" y="135" text-anchor="middle" style="fill:var(--fig-ok)">never compiled</text>
          </g>

          <path  d="M394,100 H434" fill="none" stroke="var(--fig-graphite)"
                stroke-width="1.5" marker-end="url(#fig-arrow2)"/>

          <g class="pop pop--2">
            <rect x="440" y="56" width="170" height="88" rx="10" fill="var(--fig-panel)" stroke="var(--fig-line)"/>
            <text class="t-title t-grey" x="525" y="90" text-anchor="middle">Extracted model</text>
            <text class="t-body" x="525" y="112" text-anchor="middle">entities · actions · rules</text>
            <text class="t-body" x="525" y="130" text-anchor="middle">navigation · .xafml</text>
          </g>

          <path  d="M618,100 H662" fill="none" stroke="var(--fig-graphite)"
                stroke-width="1.5" marker-end="url(#fig-arrow2)"/>

          <!-- outputs: what you get, so in colour -->
          <g class="pop pop--3">
            <rect x="668" y="50" width="212" height="30" rx="8" fill="var(--fig-yours-soft)" stroke="var(--fig-yours)"/>
            <text class="t-mono t-body" x="774" y="70" text-anchor="middle" style="fill:var(--fig-yours)">AGENTS.md · CLAUDE.md</text>
            <rect x="668" y="86" width="212" height="30" rx="8" fill="var(--fig-yours-soft)" stroke="var(--fig-yours)"/>
            <text class="t-mono t-body" x="774" y="106" text-anchor="middle" style="fill:var(--fig-yours)">MCP server</text>
            <rect x="668" y="122" width="212" height="30" rx="8" fill="var(--fig-yours-soft)" stroke="var(--fig-yours)"/>
            <text class="t-mono t-body" x="774" y="142" text-anchor="middle" style="fill:var(--fig-yours)">Markdown · JSON</text>
          </g>

          <text class="t-body" x="20" y="182">Because nothing is compiled, it works on a branch that does not build —</text>
          <text class="t-body" x="20" y="199">which is often exactly when you need to know what the application does.</text>
        </svg>
