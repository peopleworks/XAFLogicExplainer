<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420"
     viewBox="0 0 1000 420" role="img" aria-labelledby="cover-t cover-d">
  <title id="cover-t">Tu agente sabe XAF. Nunca ha visto tu aplicación.</title>
  <desc id="cover-d">LO QUE ESCRIBE EL AGENTE: Invoice.TotalAmount. LO QUE TIENE TU CLASE: Invoice.Total.</desc>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cap  { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
             letter-spacing: .13em; }
    .head { font-size: 40px; font-weight: 640; letter-spacing: -.015em; }
    .body { fill: #8794a4; }
  </style>

  <defs>
    <!-- A flat rectangle at 1200px reads as an empty slide. The grid is barely visible and
         only has to keep the surface from looking like a placeholder. -->
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f2f5f8" opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1000" height="420" fill="#07090c"/>
  <rect width="1000" height="420" fill="url(#grid)"/>

  <text class="cap" x="56" y="54"
        style="fill:#64707e;font-size:11.5px">XAF LOGIC EXPLAINER  ·  MIT  ·  CÓDIGO ABIERTO</text>

  <!-- Grey line, then colour: framework knowledge is the plentiful half, yours is the scarce one. -->
  <text class="head" x="56" y="132" style="fill:#737f8f">Tu agente sabe XAF.</text>
  <text class="head" x="56" y="178" style="fill:#f2f5f8">Nunca ha visto <tspan
        style="fill:#ff8a3d">tu aplicación.</tspan></text>

  <g>
    <rect x="56" y="208" width="424" height="130" rx="12"
          fill="#10151d" stroke="#232b36" stroke-width="1"/>
    <text class="cap" x="78" y="239"
          style="fill:#737f8f;font-size:11px">LO QUE ESCRIBE EL AGENTE</text>
    <text class="mono" x="78" y="284"
          style="fill:#737f8f;font-size:27px;font-weight:600">Invoice.TotalAmount</text>
    <text class="body" x="78" y="316"
          style="font-size:12px">XAF impecable. Miembro inexistente.</text>
  </g>

  <g>
    <rect x="520" y="208" width="424" height="130" rx="12"
          fill="rgba(255,138,61,.10)" stroke="#ff8a3d" stroke-width="1.5"/>
    <text class="cap" x="542" y="239"
          style="fill:#ff8a3d;font-size:11px">LO QUE TIENE TU CLASE</text>
    <text class="mono" x="542" y="284"
          style="fill:#ff8a3d;font-size:27px;font-weight:600">Invoice.Total</text>
    <text class="body" x="542" y="316"
          style="font-size:12px">Leído de tu código, con Roslyn.</text>
  </g>

  <text class="mono" x="56" y="384"
        style="fill:#8794a4;font-size:14px">$ dotnet tool install -g XafLogicExplainer.Cli</text>
  <text class="mono" x="944" y="384" text-anchor="end"
        style="fill:#64707e;font-size:11px">github.com/peopleworks/XAFLogicExplainer</text>
</svg>
