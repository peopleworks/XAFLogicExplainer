<!doctype html>
<html><head><meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  background: #07090c;
  color: #f2f5f8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* The same barely-there grid the covers use, so a still lifted from the video sits beside
   them without looking like it came from somewhere else. */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, #f2f5f8 1px, transparent 0);
  background-size: 26px 26px; opacity: .035;
}
/* Column rather than absolute placement: the content block centres itself in whatever room is
   left between the eyebrow and the closing line, so a scene with two rows and one with three
   do not both leave a hole in the middle of the frame. */
.stage {
  position: relative; width: 100%; height: 100%; padding: 52px 72px 62px;
  display: flex; flex-direction: column;
}
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
.cap {
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #64707e;
}
.head { font-size: 44px; font-weight: 640; letter-spacing: -.015em; line-height: 1.18; }
.yours { color: #ff8a3d; }
.grey { color: #737f8f; }
.mut { color: #8794a4; }

.pill {
  display: inline-block; padding: 7px 15px; border-radius: 999px;
  border: 1px solid #232b36; color: #8794a4; font-size: 15px; margin-right: 10px;
}
.pill--accent { border-color: #ff8a3d; color: #ff8a3d; }

/* Every animation is `both` and starts at zero, because frames are captured by setting
   currentTime -- a negative delay would place a frame before the timeline and capture nothing. */
[class*="anim-"] { animation-duration: .5s; animation-fill-mode: both; animation-timing-function:
  cubic-bezier(.2,.7,.3,1); }
@keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes dim   { from { opacity: 1; } to { opacity: .3; } }
@keyframes out   { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
@keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.anim-rise { animation-name: rise; }
.anim-fade { animation-name: fade; }
.anim-dim  { animation-name: dim; }
.anim-wipe { animation-name: wipe; }
.anim-grow { animation-name: grow; transform-origin: left center; }


.bars { display:flex; flex-direction:column; gap:54px; }
.bar .lab { font-size:22px; color:#8794a4; margin-bottom:16px; }
.bar .track { display:flex; align-items:center; gap:22px; }
.bar .fill { height:46px; border-radius:9px; transform-origin:left center; }
.bar .val { font-size:26px; font-weight:640; }
.bar--a .fill { background:#ff8a3d; }
.bar--a .val  { color:#ff8a3d; }
.bar--a .lab  { color:#f2f5f8; }
.bar--b .fill { background:#46505e; }
.bar--b .val  { color:#737f8f; }
.close { font-size:30px; font-weight:640; }

</style></head>
<body>
<div class="stage">
  <div class="cap" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 0.15s both fade">TWO TIERS, ON PURPOSE</div>
  <div class="main">
    <div class="bars">
      
  <div class="bar bar--a">
    <div class="lab" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 0.7s both fade">AGENTS.md — read on every single request</div>
    <div class="track">
      <div class="fill" style="width:144px;
           animation:1.1s cubic-bezier(.2,.7,.3,1) 0.95s both grow"></div>
      <div class="val mono" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 1.8s both fade">11 KB</div>
    </div>
  </div>
      
  <div class="bar bar--b">
    <div class="lab" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 3.4s both fade">opened only when the agent needs it</div>
    <div class="track">
      <div class="fill" style="width:900px;
           animation:1.1s cubic-bezier(.2,.7,.3,1) 3.65s both grow"></div>
      <div class="val mono" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 4.5s both fade">70 KB</div>
    </div>
  </div>
    </div>
  </div>
  <div class="close" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 9.2s both rise">If it isn't listed, it does not exist.</div>
</div>
</body></html>
