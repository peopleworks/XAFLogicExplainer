<!doctype html>
<html><head><meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  background: #07090c;
  color: #f2f5f8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, #f2f5f8 1px, transparent 0);
  background-size: 26px 26px; opacity: .035;
}
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
.yours { color: #ff8a3d; }
.grey { color: #737f8f; }
.mut { color: #8794a4; }

/* Every animation is `both` and starts at zero, because frames are captured by setting
   currentTime -- a negative delay would place a frame before the timeline and capture nothing. */
@keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes dim   { from { opacity: 1; } to { opacity: .3; } }
@keyframes out   { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
@keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Column rather than absolute placement: the content block centres itself in whatever room is
   left between the eyebrow and the closing line, so a scene with two rows and one with three
   do not both leave a hole in the middle of the frame. */
.stage {
  position: relative; width: 100%; height: 100%; padding: 52px 72px 62px;
  display: flex; flex-direction: column;
}
.cap {
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #64707e;
}
.head { font-size: 44px; font-weight: 640; letter-spacing: -.015em; line-height: 1.18; }
.pill {
  display: inline-block; padding: 7px 15px; border-radius: 999px;
  border: 1px solid #232b36; color: #8794a4; font-size: 15px; margin-right: 10px;
}
.pill--accent { border-color: #ff8a3d; color: #ff8a3d; }


.head { font-size:52px; }
.cmd {
  margin-top:52px; display:inline-block; border:1px solid #232b36; background:#10151d;
  border-radius:12px; padding:17px 24px; font-size:21px; color:#8794a4;
}
.repo { margin-top:26px; font-size:20px; color:#ff8a3d; }

</style></head>
<body>
<div class="stage">
  <div class="main">
    <div>
      <div class="head grey" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 0.4s both rise">Your agent already knows XAF.</div>
      <div class="head" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 1.9s both rise">Let's teach it <span
        class="yours">your application.</span></div>
      <div class="cmd mono" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 4.6s both rise">dotnet tool install -g XafLogicExplainer.Cli</div>
      <div class="repo mono" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 6.6s both fade">github.com/peopleworks/XAFLogicExplainer</div>
    </div>
  </div>
  <div><span class="pill" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 9.6s both fade">Free</span>
<span class="pill" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 9.9s both fade">MIT</span>
<span class="pill" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 10.2s both fade">.NET 10</span></div>
</div>
</body></html>
