<!doctype html>
<html><head><meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  background: #07090c;
  color: #f2f5f8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, #f2f5f8 1px, transparent 0);
  background-size: 26px 26px; opacity: .035;
}
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
.yours { color: #ff8a3d; }
.grey { color: #737f8f; }
.mut { color: #8794a4; }

/* Every animation is `both` and starts at zero, because frames are captured by setting
   currentTime -- a negative delay would place a frame before the timeline and capture nothing. */
@keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes dim   { from { opacity: 1; } to { opacity: .3; } }
@keyframes out   { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
@keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* Column rather than absolute placement: the content block centres itself in whatever room is
   left between the eyebrow and the closing line, so a scene with two rows and one with three
   do not both leave a hole in the middle of the frame. */
.stage {
  position: relative; width: 100%; height: 100%; padding: 52px 72px 62px;
  display: flex; flex-direction: column;
}
.cap {
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #64707e;
}
.head { font-size: 44px; font-weight: 640; letter-spacing: -.015em; line-height: 1.18; }
.pill {
  display: inline-block; padding: 7px 15px; border-radius: 999px;
  border: 1px solid #232b36; color: #8794a4; font-size: 15px; margin-right: 10px;
}
.pill--accent { border-color: #ff8a3d; color: #ff8a3d; }


.prompt { display:flex; align-items:center; gap:14px; margin-top:20px; }
.prompt .bubble {
  border:1px solid #232b36; background:#10151d; border-radius:12px;
  padding:14px 20px; font-size:21px; color:#f2f5f8;
}
.code { margin-top:34px; font-size:24px; line-height:1.62; color:#737f8f; }
/* pre on the code lines only, not the block: the indentation is the only thing saying these
   three lines are one attribute, but a `pre` container also renders the newlines between the
   tags -- which doubled the leading and pushed the punchline off the bottom of the frame. */
.code .ln { white-space:pre; }
.code .hit { position:relative; color:#f2f5f8; }
.code .hit::after {
  content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:#ff8a3d;
}
.flagbox { margin-top:18px; margin-left:38px; display:flex; align-items:center; gap:12px; }
.flagbox .lab { font-size:16px; color:#8794a4; }
.flagbox .val { font-size:24px; color:#ff8a3d; font-weight:600; }
.punch { margin-top:44px; }

</style></head>
<body>
<div class="stage">
  <div class="cap" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 0.15s both fade">YOU ASK YOUR CODING AGENT</div>
  <div class="main">
    <div>
      <div class="prompt" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 0.4s both rise">
        <span class="cap" style="color:#ff8a3d">&gt;</span>
        <span class="bubble">Add a validation rule to Invoice</span>
      </div>

      <div class="code" style="animation:0.7s cubic-bezier(.2,.7,.3,1) 7.6s both dim"><div class="mono ln" style="animation:0.55s cubic-bezier(.2,.7,.3,1) 1.6s both wipe">[RuleCriteria("Invoice must balance",</div><div class="mono ln" style="animation:0.55s cubic-bezier(.2,.7,.3,1) 2.0500000000000003s both wipe">    DefaultContexts.Save,</div><div class="mono ln" style="animation:0.55s cubic-bezier(.2,.7,.3,1) 2.5s both wipe">    "<span class="hit">TotalAmount</span> = Sum(Lines.Amount)")]</div>
        <div class="flagbox" style="animation:0.5s cubic-bezier(.2,.7,.3,1) 4.9s both rise">
          <span class="lab">your class has</span>
          <span class="mono val">Total</span>
        </div>
      </div>

      <div class="punch">
        <div class="head grey" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 8.0s both rise">It isn't hallucinating XAF.</div>
        <div class="head" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 9.6s both rise">It knows XAF. It has never seen <span
          class="yours">yours.</span></div>
      </div>
    </div>
  </div>
  <div style="animation:0.6s cubic-bezier(.2,.7,.3,1) 11.4s both fade">
    <span class="pill pill--accent">MIT</span>
    <span class="pill">github.com/peopleworks/XAFLogicExplainer</span>
  </div>
</div>
</body></html>
