<!doctype html>
<html><head><meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body {
  background: #07090c;
  color: #f2f5f8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* The same barely-there grid the covers use, so a still lifted from a frame sits beside them
   without looking like it came from somewhere else. */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, #f2f5f8 1px, transparent 0);
  background-size: 26px 26px; opacity: .035;
}
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
.yours { color: #ff8a3d; }
.grey { color: #737f8f; }
.mut { color: #8794a4; }

/* Every animation is `both` and starts at zero, because frames are captured by setting
   currentTime -- a negative delay would place a frame before the timeline and capture nothing. */
@keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes dim   { from { opacity: 1; } to { opacity: .3; } }
@keyframes out   { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-12px); } }
@keyframes wipe  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.stage {
  position:relative; width:100%; height:100%; padding:300px 60px 400px;
  display:flex; flex-direction:column; justify-content:center;
}
.cap {
  font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size:22px; letter-spacing:.14em; text-transform:uppercase; color:#64707e;
  margin-bottom:38px;
}
.big { font-size:62px; font-weight:640; letter-spacing:-.02em; line-height:1.14; }
.mid { font-size:40px; font-weight:600; line-height:1.28; }
.body { font-size:33px; color:#8794a4; line-height:1.4; }
.pill {
  display:inline-block; padding:13px 24px; border-radius:999px;
  border:1px solid #232b36; color:#8794a4; font-size:27px; margin:0 8px 12px 0;
}
.pill--accent { border-color:#ff8a3d; color:#ff8a3d; }
.gap { height:44px; }


.stage { padding:0; justify-content:flex-start; }
.window {
  position:absolute; left:0; right:0; top:110px; height:980px; overflow:hidden;
}
.window img { display:block; width:190%; max-width:none; }
@keyframes drift { from { transform:translate(-24%, -4%) scale(1); }
                   to   { transform:translate(-26%, -8%) scale(1.14); } }
.window .roll { animation: drift 13s linear 0s both; }
.window::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(#07090c 0%, transparent 14%, transparent 74%, #07090c 99%);
}
.lines { position:absolute; left:60px; right:60px; bottom:400px; }
.lines > div { margin-bottom:26px; }

</style></head>
<body>
<div class="stage">
  <div class="window" style="animation:0.8s cubic-bezier(.2,.7,.3,1) 0.0s both fade">
    <div class="roll"><img src="../../stills/map.png" alt=""></div>
  </div>
  <div class="lines">
    <div class="big" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 6.6s both rise">La mayoría de los equipos nunca ha visto el suyo.</div>
    <div class="mid grey" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 8.8s both rise">Vive en la cabeza de una persona.</div>
    <div class="mid yours" style="animation:0.6s cubic-bezier(.2,.7,.3,1) 10.6s both rise">Justo el conocimiento que se va cuando esa persona se va.</div>
  </div>
</div>
</body></html>
